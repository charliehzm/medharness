# MedHarness nginx · T11 TLS terminator (DMZ entrypoint)
# ADR-06: self-signed default + BYO cert path
# ADR-18 §5 egress allowlist — the edge exposes ONLY:
#   * /v1/*      → gated fork relay (every request transits the §D.1 spine)
#   * /api/v1/*  → A0 control-plane console API
#   * /health    → liveness
# Everything else is default-denied (404): the bare MCP control plane
# (/api/route, /api/audit) and every §D.1-bypass relay surface stay internal /
# disabled. MCP services (model-router / audit-log / phi-detector / desensitize
# / injection / outbound-safety) are reachable only on medharness_internal and
# are intentionally NOT proxied here.

server {
    listen 80;
    server_name _;

    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/medharness/tls/cert.pem;
    ssl_certificate_key /etc/medharness/tls/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Resolve upstreams at request time via Docker's embedded DNS so the DMZ
    # terminator boots even when an internal service is briefly unavailable
    # (variable proxy_pass defers name resolution out of the startup path).
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 32m;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── Egress allowlist (ADR-18 §5) ───────────────────────────────────────
    # 1) Gated fork relay. new-api runs the §D.1 compliance spine
    #    (MedHarnessCompliance: phi→desens→router→injection → base → outbound)
    #    before any upstream egress. This is the only model-egress entrypoint.
    location /v1/ {
        set $upstream_newapi new-api:3000;
        proxy_pass http://$upstream_newapi;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 300s;
        proxy_buffering off;   # stream SSE token-by-token
    }

    # 2) A0 control-plane console API (read-mostly; only propose/export mutate,
    #    and those return approval ids, never raw PHI).
    location /api/v1/ {
        set $upstream_a0 a0-api:9000;
        proxy_pass http://$upstream_a0;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Explicit hard-deny of the bare control plane (B1). Redundant with the
    #    default-deny below, kept explicit so the intent survives edits. ──────
    location /api/route { return 404; }
    location /api/audit { return 404; }

    # ── Default-deny: anything not allowlisted above (incl. /mj, /suno, /pg,
    #    /v1beta, /v1/video*, /kling, /jimeng, /api/*) is rejected at the edge.
    location / {
        return 404;
    }
}
